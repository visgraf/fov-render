[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fov-render"
version = "0.1.0.dev0"
description = "Blender Cycles rendering for gaze-directed binocular observers: foveated, perspective and panoramic sensors behind one rig and one sample record"
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
bpy = ["bpy==5.2.1"]
checks = ["OpenEXR==3.4.15", "pillow==12.3.0"]   # pillow: gate 5.5 imports f3d-vision's run.py (#2)

[tool.setuptools.packages.find]
include = ["fov_render*"]

[tool.setuptools.package-data]
"fov_render.sensors" = ["*.osl"]
"fov_render.checks" = ["known/*.json", "known/*.npz", "fixtures/*.py", "fixtures/*.md"]
